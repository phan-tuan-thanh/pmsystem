services:
  plane-web:
    image: ${PLANE_WEB_IMAGE}
    container_name: plane-web
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-web.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`)"
      - "traefik.http.routers.plane-web.entrypoints=websecure"
      - "traefik.http.routers.plane-web.tls=true"
      - "traefik.http.services.plane-web.loadbalancer.server.port=3000"
    networks:
      - plane-network

  plane-api:
    image: ${PLANE_API_IMAGE}
    container_name: plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      USE_MINIO: ${USE_MINIO:-0}
      STORAGE_TYPE: ${STORAGE_TYPE}
      AMQP_URL: ${AMQP_URL}
      GUNICORN_WORKERS: 1
      LIVE_SERVER_SECRET_KEY: ${SECRET_KEY}
      SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
      DEBUG: 0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      WEB_URL: ${WEB_URL}
      APP_BASE_URL: ${WEB_URL}
      ADMIN_BASE_URL: ${ADMIN_URL}
      SPACE_BASE_URL: ${SPACE_URL}
    volumes:
      - ./uploads:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health/ || wget -qO- http://127.0.0.1:8000/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-api.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static`))"
      - "traefik.http.routers.plane-api.entrypoints=websecure"
      - "traefik.http.routers.plane-api.tls=true"
      - "traefik.http.services.plane-api.loadbalancer.server.port=8000"
    networks:
      - plane-network

  plane-worker:
    image: ${PLANE_WORKER_IMAGE}
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      USE_MINIO: ${USE_MINIO:-0}
      STORAGE_TYPE: ${STORAGE_TYPE}
      AMQP_URL: ${AMQP_URL}
      WEB_URL: ${WEB_URL}
      DEBUG: 0
      LIVE_SERVER_SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./uploads:/app/media
    depends_on:
      plane-api:
        condition: service_healthy
    networks:
      - plane-network

  plane-migrator:
    image: ${PLANE_API_IMAGE}
    container_name: plane-migrator
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      DOCKERIZED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plane-network

  plane-space:
    image: ${PLANE_SPACE_IMAGE}
    container_name: plane-space
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-space.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && PathPrefix(`/space`)"
      - "traefik.http.routers.plane-space.entrypoints=websecure"
      - "traefik.http.routers.plane-space.tls=true"
      - "traefik.http.services.plane-space.loadbalancer.server.port=3000"
    networks:
      - plane-network

  plane-live:
    image: ${PLANE_LIVE_IMAGE}
    container_name: plane-live
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: http://plane-api:8000
      LIVE_SERVER_SECRET_KEY: ${SECRET_KEY}
    depends_on:
      plane-api:
        condition: service_healthy
    networks:
      - plane-network

  plane-admin:
    image: ${PLANE_ADMIN_IMAGE}
    container_name: plane-admin
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-admin.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (PathPrefix(`/admin`) || PathPrefix(`/god-mode`))"
      - "traefik.http.routers.plane-admin.entrypoints=websecure"
      - "traefik.http.routers.plane-admin.tls=true"
      - "traefik.http.services.plane-admin.loadbalancer.server.port=3000"
      # Redirect /god-mode and /admin (no trailing slash) to /god-mode/ and /admin/ at Traefik level.
      # nginx inside the container would otherwise redirect using its internal port (3000/HTTP),
      # producing a broken Location header like http://host:3000/god-mode/.
      - "traefik.http.middlewares.plane-admin-slash.redirectregex.regex=^(https?://[^/]+/(god-mode|admin))$$"
      - "traefik.http.middlewares.plane-admin-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.plane-admin-slash.redirectregex.permanent=true"
      - "traefik.http.routers.plane-admin.middlewares=plane-admin-slash"
    networks:
      - plane-network

  plane-beat-worker:
    image: ${PLANE_API_IMAGE}
    container_name: plane-beat-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      AMQP_URL: ${AMQP_URL}
      WEB_URL: ${WEB_URL}
      DEBUG: 0
      LIVE_SERVER_SECRET_KEY: ${SECRET_KEY}
    depends_on:
      plane-api:
        condition: service_healthy
    networks:
      - plane-network

networks:
  plane-network:
    external: true
    name: plane-network
