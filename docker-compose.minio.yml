services:
  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    volumes:
      - ./uploads:/export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-s3.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.minio-s3.entrypoints=websecure"
      - "traefik.http.routers.minio-s3.tls=true"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"
    networks:
      - plane-network

  plane-minio-init:
    image: minio/mc:latest
    container_name: plane-minio-init
    restart: "no"
    depends_on:
      plane-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://plane-minio:9000 ${AWS_ACCESS_KEY_ID:-access-key} ${AWS_SECRET_ACCESS_KEY:-secret-key} &&
        mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-uploads} &&
        mc anonymous set download local/${AWS_S3_BUCKET_NAME:-uploads} &&
        echo 'MinIO bucket ready.'
      "
    networks:
      - plane-network

networks:
  plane-network:
    external: true
    name: plane-network
