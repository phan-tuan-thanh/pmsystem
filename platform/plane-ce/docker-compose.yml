version: "3.8"

services:
  # Plane Backend API
  plane-backend:
    image: makeplane/plane-backend:latest
    container_name: platform-plane-backend
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      DEBUG: "0"
      ENVIRONMENT: production
      DJANGO_SETTINGS_MODULE: plane.settings.production

      # Database
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB:-plane_ce}
      DATABASE_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      DATABASE_PORT: "5432"
      POSTGRES_HOST: platform-postgres
      POSTGRES_DB: ${PLANE_POSTGRES_DB:-plane_ce}
      POSTGRES_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      POSTGRES_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      POSTGRES_PORT: "5432"

      # Redis
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://platform-redis:6379

      # Security
      SECRET_KEY: ${PLANE_SECRET_KEY:-ReplaceWithLongRandomKeyForPlane789!}

      # Site Configuration
      SITE_URL: https://app.${DOMAIN:-local.test}
      WEB_URL: https://app.${DOMAIN:-local.test}
      API_BASE_URL: https://app.${DOMAIN:-local.test}/api

      # CORS
      ALLOWED_HOSTS: "app.${DOMAIN:-local.test},${DOMAIN:-local.test},localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "https://app.${DOMAIN:-local.test},https://${DOMAIN:-local.test}"

      # Admin Setup
      ADMIN_EMAIL: ${PLANE_ADMIN_EMAIL:-admin@plane.local}
      ADMIN_PASSWORD: ${PLANE_ADMIN_PASSWORD:-PlaneAdmin123!}

      # Email Configuration
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${SMTP_HOST:-localhost}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER:-noreply@plane.local}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_USER: ${SMTP_FROM:-noreply@plane.local}

      # File Storage (Local or S3/MinIO)
      USE_S3: "1"
      AWS_STORAGE_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-plane-files}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://platform-minio:9000}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}

      # Logging
      LOG_LEVEL: INFO

    networks:
      - proxy
    depends_on:
      - plane-migration
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-api.entrypoints=websecure"
      - "traefik.http.routers.plane-api.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.plane-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-api.loadbalancer.server.port=8000"

  # Database Migration Service (runs once on startup)
  plane-migration:
    image: makeplane/plane-backend:latest
    container_name: platform-plane-migration
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      echo 'Migration completed successfully'
      "
    environment:
      DEBUG: "0"
      ENVIRONMENT: production
      DJANGO_SETTINGS_MODULE: plane.settings.production

      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB:-plane_ce}
      DATABASE_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      DATABASE_PORT: "5432"
      POSTGRES_HOST: platform-postgres
      POSTGRES_DB: ${PLANE_POSTGRES_DB:-plane_ce}
      POSTGRES_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      POSTGRES_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      POSTGRES_PORT: "5432"

      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://platform-redis:6379

      SECRET_KEY: ${PLANE_SECRET_KEY:-ReplaceWithLongRandomKeyForPlane789!}

    networks:
      - proxy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: "no"

  # Background Worker (Celery)
  plane-worker:
    image: makeplane/plane-worker:latest
    container_name: platform-plane-worker
    restart: unless-stopped
    environment:
      DEBUG: "0"
      ENVIRONMENT: production
      DJANGO_SETTINGS_MODULE: plane.settings.production

      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB:-plane_ce}
      DATABASE_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      DATABASE_PORT: 5432

      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://platform-redis:6379

      SECRET_KEY: ${PLANE_SECRET_KEY:-ReplaceWithLongRandomKeyForPlane789!}

      SITE_URL: https://app.${DOMAIN:-local.test}

      USE_S3: "1"
      AWS_STORAGE_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-plane-files}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://platform-minio:9000}

    networks:
      - proxy
    depends_on:
      - plane-backend
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "celery", "-A", "plane", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Beat (Scheduler)
  plane-beat:
    image: makeplane/plane-worker:latest
    container_name: platform-plane-beat
    restart: unless-stopped
    environment:
      DEBUG: "0"
      ENVIRONMENT: production
      DJANGO_SETTINGS_MODULE: plane.settings.production

      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB:-plane_ce}
      DATABASE_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      DATABASE_PORT: 5432

      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://platform-redis:6379

      SECRET_KEY: ${PLANE_SECRET_KEY:-ReplaceWithLongRandomKeyForPlane789!}

      SITE_URL: https://app.${DOMAIN:-local.test}

    networks:
      - proxy
    depends_on:
      - plane-backend
    volumes:
      - ./logs:/app/logs

  # Frontend (Next.js)
  plane-frontend:
    image: makeplane/plane-frontend:latest
    container_name: platform-plane-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN:-local.test}/api
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN:-local.test}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://admin.${DOMAIN:-local.test}
      NEXT_PUBLIC_ASSET_PREFIX: https://app.${DOMAIN:-local.test}

    networks:
      - proxy
    depends_on:
      - plane-backend
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-frontend.entrypoints=websecure"
      - "traefik.http.routers.plane-frontend.rule=Host(`app.${DOMAIN}`) && Path(`/`)"
      - "traefik.http.routers.plane-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-frontend.loadbalancer.server.port=3000"

  # Public Space (Shared Views)
  plane-space:
    image: makeplane/plane-space:latest
    container_name: platform-plane-space
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN:-local.test}/api
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN:-local.test}

    networks:
      - proxy
    depends_on:
      - plane-backend
    ports:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-space.entrypoints=websecure"
      - "traefik.http.routers.plane-space.rule=Host(`space.${DOMAIN}`)"
      - "traefik.http.routers.plane-space.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-space.loadbalancer.server.port=3001"

  # Admin Panel
  plane-admin:
    image: makeplane/plane-admin:latest
    container_name: platform-plane-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN:-local.test}/api
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN:-local.test}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://admin.${DOMAIN:-local.test}

    networks:
      - proxy
    depends_on:
      - plane-backend
    ports:
      - "3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-admin.entrypoints=websecure"
      - "traefik.http.routers.plane-admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.plane-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-admin.loadbalancer.server.port=3002"

  # Real-time WebSocket Server
  plane-live:
    image: makeplane/plane-live:latest
    container_name: platform-plane-live
    restart: unless-stopped
    environment:
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB:-plane_ce}
      DATABASE_USER: ${PLANE_POSTGRES_USER:-plane_ce}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD:-PlanePass123!}
      DATABASE_PORT: 5432

      REDIS_HOST: platform-redis
      REDIS_PORT: 6379

      SECRET_KEY: ${PLANE_SECRET_KEY:-ReplaceWithLongRandomKeyForPlane789!}

    networks:
      - proxy
    depends_on:
      - plane-backend
    ports:
      - "3003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-live.entrypoints=websecure"
      - "traefik.http.routers.plane-live.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.plane-live.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-live.loadbalancer.server.port=3003"

networks:
  proxy:
    external: true
