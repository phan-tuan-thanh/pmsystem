version: "3.8"

services:
  # Plane Backend API Server
  plane-backend:
    image: makeplane/plane-backend:latest
    container_name: platform-plane-backend
    restart: unless-stopped
    environment:
      # Core Configuration
      DJANGO_SETTINGS_MODULE: plane.settings.production
      DEBUG: "0"
      
      # Database Configuration
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB}
      DATABASE_USER: ${PLANE_POSTGRES_USER}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD}
      DATABASE_PORT: 5432
      
      # Redis Configuration
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Secret Key (for session encryption)
      SECRET_KEY: ${PLANE_SECRET_KEY}
      
      # Email Configuration (optional, if using SMTP)
      EMAIL_HOST: ${SMTP_HOST:-localhost}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${SMTP_FROM:-noreply@plane.local}
      
      # AWS S3 / MinIO Configuration (for file uploads)
      AWS_STORAGE_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      
      # CORS & Security
      CORS_ALLOWED_ORIGINS: https://app.${DOMAIN},https://${DOMAIN}
      
      # Site URL
      SITE_URL: https://app.${DOMAIN}
      
      # API Base URL
      API_BASE_URL: https://app.${DOMAIN}/api
      
      # File size limit (in bytes)
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      
      # Allowed frontend URLs
      WEB_URL: https://app.${DOMAIN}
      
      # Admin Email & Password (for initial setup)
      ADMIN_EMAIL: ${PLANE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${PLANE_ADMIN_PASSWORD}
    networks:
      - proxy
    volumes:
      # Mount logs directory
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Plane Background Worker (Celery)
  plane-worker:
    image: makeplane/plane-worker:latest
    container_name: platform-plane-worker
    restart: unless-stopped
    environment:
      # Core Configuration
      DJANGO_SETTINGS_MODULE: plane.settings.production
      DEBUG: "0"
      
      # Database Configuration
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB}
      DATABASE_USER: ${PLANE_POSTGRES_USER}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD}
      DATABASE_PORT: 5432
      
      # Redis Configuration
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Secret Key
      SECRET_KEY: ${PLANE_SECRET_KEY}
      
      # AWS S3 / MinIO Configuration
      AWS_STORAGE_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      
      # Email Configuration
      EMAIL_HOST: ${SMTP_HOST:-localhost}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${SMTP_FROM:-noreply@plane.local}
      
      # Site URL
      SITE_URL: https://app.${DOMAIN}
    networks:
      - proxy
    depends_on:
      - plane-backend
    volumes:
      - ./logs/worker:/app/logs

  # Plane Scheduler (Beat Worker)
  plane-beat:
    image: makeplane/plane-worker:latest
    container_name: platform-plane-beat
    restart: unless-stopped
    environment:
      # Core Configuration
      DJANGO_SETTINGS_MODULE: plane.settings.production
      DEBUG: "0"
      
      # Database Configuration
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB}
      DATABASE_USER: ${PLANE_POSTGRES_USER}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD}
      DATABASE_PORT: 5432
      
      # Redis Configuration
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Secret Key
      SECRET_KEY: ${PLANE_SECRET_KEY}
      
      # AWS S3 / MinIO Configuration
      AWS_STORAGE_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      
      # Site URL
      SITE_URL: https://app.${DOMAIN}
    networks:
      - proxy
    depends_on:
      - plane-backend
    volumes:
      - ./logs/beat:/app/logs

  # Plane Frontend (Web UI)
  plane-frontend:
    image: makeplane/plane-frontend:latest
    container_name: platform-plane-frontend
    restart: unless-stopped
    environment:
      # Frontend Configuration
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN}/api
      NEXT_PUBLIC_ADMIN_BASE_URL: https://admin.${DOMAIN}
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN}
      NEXT_PUBLIC_ASSET_PREFIX: https://app.${DOMAIN}
      
      # Analytics (if needed)
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
    networks:
      - proxy
    depends_on:
      - plane-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-frontend.entrypoints=websecure"
      - "traefik.http.routers.plane-frontend.rule=Host(`app.${DOMAIN}`) && Path(`/`)"
      - "traefik.http.routers.plane-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-frontend.loadbalancer.server.port=3000"

  # Plane Space (Public sharing)
  plane-space:
    image: makeplane/plane-space:latest
    container_name: platform-plane-space
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN}/api
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN}
    networks:
      - proxy
    depends_on:
      - plane-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-space.entrypoints=websecure"
      - "traefik.http.routers.plane-space.rule=Host(`space.${DOMAIN}`) || (Host(`app.${DOMAIN}`) && Path(`/space/*`))"
      - "traefik.http.routers.plane-space.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-space.loadbalancer.server.port=3001"

  # Plane Admin Panel
  plane-admin:
    image: makeplane/plane-admin:latest
    container_name: platform-plane-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://app.${DOMAIN}/api
      NEXT_PUBLIC_WEB_URL: https://app.${DOMAIN}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://admin.${DOMAIN}
    networks:
      - proxy
    depends_on:
      - plane-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-admin.entrypoints=websecure"
      - "traefik.http.routers.plane-admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.plane-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-admin.loadbalancer.server.port=3002"

  # Plane Live (WebSocket for real-time features)
  plane-live:
    image: makeplane/plane-live:latest
    container_name: platform-plane-live
    restart: unless-stopped
    environment:
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_POSTGRES_DB}
      DATABASE_USER: ${PLANE_POSTGRES_USER}
      DATABASE_PASSWORD: ${PLANE_POSTGRES_PASSWORD}
      DATABASE_PORT: 5432
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${PLANE_SECRET_KEY}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-live.entrypoints=websecure"
      - "traefik.http.routers.plane-live.rule=Host(`app.${DOMAIN}`) && Path(`/ws/*`)"
      - "traefik.http.routers.plane-live.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-live.loadbalancer.server.port=3003"

networks:
  proxy:
    external: true
