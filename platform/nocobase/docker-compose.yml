services:
  nocobase:
    image: nocobase/nocobase:latest
    container_name: platform-nocobase
    restart: unless-stopped
    environment:
      - DB_DIALECT=postgres
      - DB_HOST=platform-postgres
      - DB_PORT=5432
      - DB_USER=${NOCOBASE_POSTGRES_USER}
      - DB_PASSWORD=${NOCOBASE_POSTGRES_PASSWORD}
      - DB_DATABASE=${NOCOBASE_POSTGRES_DB}
      - APP_KEY=${NOCOBASE_APP_KEY}
      - APP_PORT=13000
      - INIT_ROOT_EMAIL=${NOCOBASE_ADMIN_EMAIL}
      - INIT_ROOT_PASSWORD=${NOCOBASE_ADMIN_PASSWORD}
      - INIT_ROOT_NICKNAME=Admin
    volumes:
      - nocobase_storage:/app/nocobase/storage
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nocobase.entrypoints=websecure"
      - "traefik.http.routers.nocobase.rule=Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.nocobase.tls.certresolver=letsencrypt"
      - "traefik.http.services.nocobase.loadbalancer.server.port=13000"

networks:
  proxy:
    external: true

volumes:
  nocobase_storage:
