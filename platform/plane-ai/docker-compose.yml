version: "3.8"

services:
  # Plane AI Service - Handles AI-powered features for Agile
  plane-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-plane-ai
    restart: unless-stopped
    environment:
      # Core Configuration
      DEBUG: "0"
      ENVIRONMENT: production

      # Plane CE Integration
      PLANE_API_BASE_URL: https://app.${DOMAIN}/api
      PLANE_API_TOKEN: ${PLANE_AI_SERVICE_TOKEN}

      # OpenAI or compatible LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-3.5-turbo}

      # Redis Configuration (for task queue)
      REDIS_HOST: platform-redis
      REDIS_PORT: 6379
      REDIS_DB: 1

      # Database Configuration (optional, for storing AI suggestions/history)
      DATABASE_HOST: platform-postgres
      DATABASE_NAME: ${PLANE_AI_DB:-plane_ai}
      DATABASE_USER: ${PLANE_AI_POSTGRES_USER:-plane_ai}
      DATABASE_PASSWORD: ${PLANE_AI_POSTGRES_PASSWORD:-PlaneAIPass123!}
      DATABASE_PORT: 5432

      # Service Configuration
      SERVICE_PORT: 8001
      LOG_LEVEL: INFO
    networks:
      - proxy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-ai.entrypoints=websecure"
      - "traefik.http.routers.plane-ai.rule=Host(`ai.${DOMAIN}`)"
      - "traefik.http.routers.plane-ai.tls=true"
      - "traefik.http.services.plane-ai.loadbalancer.server.port=8001"

networks:
  proxy:
    external: true
